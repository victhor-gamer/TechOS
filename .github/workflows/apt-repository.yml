name: Build TechOS APT repository

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/build-deb.sh"
      - "scripts/build-apt-repo.sh"
      - ".github/workflows/apt-repository.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils python3-tk

      - name: Build TechOS Welcome package
        run: sh scripts/build-deb.sh

      - name: Generate unsigned APT repository
        run: sh scripts/build-apt-repo.sh

      - name: Upload unsigned repository for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: techos-apt-unsigned
          path: public/
          if-no-files-found: error
          retention-days: 7
