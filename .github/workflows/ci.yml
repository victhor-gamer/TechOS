name: TechOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Debian package and Tkinter tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk dpkg-dev

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build TechOS Welcome package
        run: sh scripts/build-deb.sh

      - name: Verify generated Debian package
        run: dpkg-deb --info build/techos-welcome_0.1.0_all.deb
